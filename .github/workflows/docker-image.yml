name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: '构建 Docker 镜像'
      run: |
        docker build -t dontcrack-windows .
    - name: '导出并上传镜像工件'
      run: |
        docker save dontcrack-windows | gzip > dontcrack-windows-image.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: 'dontcrack-windows-docker-image-${{ github.ref_name }}'
        path: 'dontcrack-windows-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14
