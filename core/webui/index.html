<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DontCrack 控制台</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; color: #222; }
@media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #eee; } }
h1 { margin: 0 0 8px; font-size: 1.4em; }
header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 16px 20px; border-radius: 8px; margin-bottom: 16px; }
header .ver { font-size: 0.85em; opacity: 0.85; }
.card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
@media (prefers-color-scheme: dark) { .card { background: #2a2a2a; } }
.card h2 { margin: 0 0 12px; font-size: 1.1em; }
.row { display: flex; flex-wrap: wrap; gap: 16px; }
.col { flex: 1; min-width: 160px; }
.kv { margin-bottom: 6px; }
.kv .k { font-weight: 600; display: inline-block; min-width: 110px; color: #555; }
@media (prefers-color-scheme: dark) { .kv .k { color: #aaa; } }
.kv .v { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.state-running { color: #16a34a; font-weight: 600; }
.state-stopped { color: #dc2626; font-weight: 600; }
.btn { padding: 8px 16px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: .95em; margin-right: 8px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: #2563eb; color: white; }
.btn-danger { background: #dc2626; color: white; }
.btn-primary:hover:not(:disabled) { background: #1d4ed8; }
.btn-danger:hover:not(:disabled) { background: #b91c1c; }
.log-box { background: #1e1e1e; color: #d4d4d4; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; padding: 12px; border-radius: 6px; max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
@media (prefers-color-scheme: dark) { .log-box { background: #0e0e0e; } }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar input[type=password] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
@media (prefers-color-scheme: dark) { .toolbar input[type=password] { background: #1a1a1a; border-color: #444; color: #eee; } }
.indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.indicator.on { background: #16a34a; }
.indicator.off { background: #dc2626; }
footer { text-align: center; color: #888; font-size: .85em; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <h1>🔧 DontCrack 控制台</h1>
  <div class="ver" id="ver">加载中…</div>
</header>

<div class="card">
  <h2>身份验证</h2>
  <div class="toolbar">
    <input type="password" id="pwd" placeholder="password (URL 参数 ?password=... 也可)" />
    <button class="btn btn-primary" onclick="loadAll()">连接</button>
    <span id="status-indicator"><span class="indicator off"></span><span id="status-text">未连接</span></span>
  </div>
</div>

<div class="card">
  <h2>进程状态</h2>
  <div class="row">
    <div class="col">
      <div class="kv"><span class="k">状态:</span> <span class="v" id="state">—</span></div>
      <div class="kv"><span class="k">PID:</span> <span class="v" id="pid">—</span></div>
      <div class="kv"><span class="k">文件类型:</span> <span class="v" id="filetype">—</span></div>
    </div>
    <div class="col">
      <div class="kv"><span class="k">重启次数:</span> <span class="v" id="restart">—</span></div>
      <div class="kv"><span class="k">上次退出码:</span> <span class="v" id="lastexit">—</span></div>
      <div class="kv"><span class="k">上次退出时间:</span> <span class="v" id="lasttime">—</span></div>
    </div>
  </div>
  <div style="margin-top:12px">
    <button class="btn btn-primary" id="btn-start" onclick="doAction('startup')">▶ 启动</button>
    <button class="btn btn-danger" id="btn-stop" onclick="doAction('shutdown')">■ 停止</button>
  </div>
</div>

<div class="card">
  <h2>最近日志</h2>
  <div class="log-box" id="logs">尚未加载</div>
  <div style="margin-top:8px">
    <button class="btn btn-primary" onclick="loadAll()">刷新</button>
  </div>
</div>

<footer>DontCrack By FasterEdge · 自动每 3 秒刷新</footer>

<script>
const params = new URLSearchParams(location.search);
let pwd = params.get('password') || '';
document.getElementById('pwd').value = pwd;

function updateIndicator(connected) {
  const ind = document.querySelector('#status-indicator .indicator');
  const txt = document.getElementById('status-text');
  if (connected) { ind.className = 'indicator on'; txt.textContent = '已连接'; }
  else { ind.className = 'indicator off'; txt.textContent = '未连接'; }
}

async function loadAll() {
  pwd = document.getElementById('pwd').value || pwd;
  const u = pwd ? `?password=${encodeURIComponent(pwd)}` : '';
  try {
    const r = await fetch('/heartbeat' + u);
    if (!r.ok) { updateIndicator(false); return; }
    const d = await r.json();
    updateIndicator(true);
    document.getElementById('ver').textContent = `v${d.version} · ${d.file_type} · ${d.process_path}`;
    document.getElementById('state').innerHTML = d.state === 'running'
      ? '<span class="state-running">● running</span>'
      : '<span class="state-stopped">● stopped</span>';
    document.getElementById('pid').textContent = d.process_pid || '—';
    document.getElementById('filetype').textContent = d.file_type;
    document.getElementById('restart').textContent = d.restart_count;
    document.getElementById('lastexit').textContent = d.last_exit_code !== undefined ? d.last_exit_code : '—';
    document.getElementById('lasttime').textContent = d.last_exit_time || '—';
    const logs = (d.logs || []).join('\n') || '(无日志)';
    document.getElementById('logs').textContent = logs;
  } catch (e) {
    updateIndicator(false);
  }
}

async function doAction(action) {
  pwd = document.getElementById('pwd').value;
  if (!pwd) { alert('请先输入 password'); return; }
  const u = `?password=${encodeURIComponent(pwd)}`;
  const r = await fetch('/' + action + u, { method: 'POST' });
  if (r.ok) { setTimeout(loadAll, 500); }
  else { alert('操作失败: HTTP ' + r.status); }
}

loadAll();
setInterval(loadAll, 3000);
</script>
</body>
</html>
